plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    // The Flutter Gradle Plugin must be applied after Android/Kotlin plugins
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def localPropertiesFile = rootProject.file("local.properties")
def localProperties = new Properties()
if (localPropertiesFile.exists()) {
    localProperties.load(new FileInputStream(localPropertiesFile))
}

// Read GOOGLE_MAPS_API_KEY from project root .env first, then android/local.properties
def googleMapsApiKey = ''
def projectRoot = rootProject.rootDir.parentFile
def envFile = projectRoot != null ? new File(projectRoot, '.env') : null

if (envFile != null && envFile.exists()) {
    envFile.withReader('UTF-8') { reader ->
        reader.eachLine { line ->
            def m = line =~ /^\s*GOOGLE_MAPS_API_KEY\s*=\s*(.+)\s*$/
            if (m) {
                googleMapsApiKey = m.group(1).trim().replaceAll(/^["']|["']$/, '')
            }
        }
    }
}

if (!googleMapsApiKey) {
    googleMapsApiKey = localProperties.getProperty('GOOGLE_MAPS_API_KEY', '').trim()
}

if (!googleMapsApiKey) {
    logger.warn('GOOGLE_MAPS_API_KEY is missing. Add it to .env or android/local.properties.')
}

android {
    namespace = "com.hudhud.admin"
    compileSdk = 36
    ndkVersion = "27.0.12077973"

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.hudhud.admin"
        minSdkVersion = flutter.minSdkVersion
        targetSdk = 36
        versionCode = flutter.versionCode
        versionName = flutter.versionName

        manifestPlaceholders["googleMapsApiKey"] = googleMapsApiKey

        buildConfigField(
            "String",
            "GOOGLE_MAPS_API_KEY",
            "\"${googleMapsApiKey}\""
        )
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias = keystoreProperties["keyAlias"]
                keyPassword = keystoreProperties["keyPassword"]
                storePassword = keystoreProperties["storePassword"]

                def storeFilePath = keystoreProperties["storeFile"]

                if (storeFilePath) {
                    storeFile = file("${rootProject.projectDir}/${storeFilePath}")
                }
            }
        }
    }

    buildTypes {
        release {
            // Never fall back to the debug keystore for release artifacts.
            // When key.properties is missing the release signingConfig is left
            // unset and the taskGraph check below fails the build.
            if (keystorePropertiesFile.exists()) {
                signingConfig = signingConfigs.release
            }
        }
    }
}

// Fail release builds (assembleRelease / bundleRelease / flutter build apk|appbundle)
// early with a clear message when signing is not configured. Debug and profile
// builds are unaffected.
gradle.taskGraph.whenReady { graph ->
    def releaseRequested = graph.allTasks.any { task ->
        task.project == project && task.name.toLowerCase().contains("release")
    }
    if (!releaseRequested) {
        return
    }
    if (!keystorePropertiesFile.exists()) {
        throw new GradleException(
            "Release signing is not configured: ${keystorePropertiesFile} is missing. " +
            "Create android/key.properties with storeFile, storePassword, keyAlias and keyPassword " +
            "(see README). Release builds are never signed with the debug key."
        )
    }
    def missing = ["storeFile", "storePassword", "keyAlias", "keyPassword"].findAll {
        !keystoreProperties[it]
    }
    if (!missing.isEmpty()) {
        throw new GradleException(
            "Release signing is misconfigured: ${keystorePropertiesFile} is missing ${missing.join(', ')}."
        )
    }
    def storeFileCheck = file("${rootProject.projectDir}/${keystoreProperties['storeFile']}")
    if (!storeFileCheck.exists()) {
        throw new GradleException(
            "Release signing is misconfigured: keystore not found at ${storeFileCheck}."
        )
    }
}

flutter {
    source = "../.."
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}