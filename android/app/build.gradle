plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    // The Flutter Gradle Plugin must be applied after Android/Kotlin plugins
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// storeFile may be absolute or relative, and the two were not both handled.
//
// Both the signing config and the guard below used to build the path as
// "${rootProject.projectDir}/${storeFile}" unconditionally, which silently
// mangles an ABSOLUTE path by gluing it onto android/:
//
//   Release signing is misconfigured: keystore not found at
//   .../HudHud-Deliver-app/android/home/runner/work/_temp/upload-keystore.jks
//
// CI writes an absolute path, because the keystore is decoded from a secret
// into the runner's temp directory, so release builds could not be signed at
// all. A developer pointing key.properties at a keystore elsewhere on their
// machine hit the same wall.
//
// A relative path still resolves against android/ rather than android/app/,
// which is where a bare `file()` in this build script would put it - so
// anybody whose key.properties already says `storeFile=upload-keystore.jks`
// keeps working.
def resolveKeystoreFile = { path ->
    def candidate = new File(path as String)
    candidate.isAbsolute() ? candidate : file("${rootProject.projectDir}/${path}")
}

def localPropertiesFile = rootProject.file("local.properties")
def localProperties = new Properties()
if (localPropertiesFile.exists()) {
    localProperties.load(new FileInputStream(localPropertiesFile))
}

// TWO Google keys, and they are not interchangeable.
//
//   GOOGLE_MAPS_API_KEY -> com.google.android.geo.API_KEY in the manifest,
//     read by the Maps SDK for Android. The Maps SDKs are the only Google APIs
//     that honour an "Android apps" application restriction, so this key is
//     locked to com.hudhud.admin plus our signing fingerprints and can be
//     scraped out of the APK without being usable.
//
//   GOOGLE_MAPS_WEB_KEY -> the Dart calls to maps.googleapis.com: Places
//     autocomplete, place details, Geocoding, Directions. Those are
//     web-service endpoints, and Google does NOT apply Android application
//     restrictions to them - a key restricted to an Android package is
//     rejected outright with REQUEST_DENIED. So this has to be a second key
//     whose application restriction is None, narrowed the other way instead:
//     API restriction limited to Places + Geocoding + Directions, with daily
//     quota caps.
//
// One key used to serve both, and that only worked because the key was
// unrestricted. Restricting it to Android apps leaves the map drawing while
// the pickup/dropoff address lookup and the route polyline both fail, and
// nothing in the build warns you. The split exists so that hardening the SDK
// key cannot take those down with it.
def readSecret = { String name ->
    def projectRoot = rootProject.rootDir.parentFile
    def envFile = projectRoot != null ? new File(projectRoot, '.env') : null
    def value = ''
    if (envFile != null && envFile.exists()) {
        envFile.withReader('UTF-8') { reader ->
            reader.eachLine { line ->
                def m = line =~ /^\s*${name}\s*=\s*(.+)\s*$/
                if (m) {
                    value = m.group(1).trim().replaceAll(/^["']|["']$/, '')
                }
            }
        }
    }
    if (!value) {
        value = localProperties.getProperty(name, '').trim()
    }
    return value
}

def googleMapsApiKey = readSecret('GOOGLE_MAPS_API_KEY')
if (!googleMapsApiKey) {
    logger.warn('GOOGLE_MAPS_API_KEY is missing. Add it to .env or android/local.properties.')
}

// Falls back to the SDK key rather than to empty, so a build configured before
// this split behaves exactly as it always did instead of silently losing
// address lookup - the worse of the two failures, and the harder to spot.
def googleMapsWebKey = readSecret('GOOGLE_MAPS_WEB_KEY')
if (!googleMapsWebKey) {
    googleMapsWebKey = googleMapsApiKey
    if (googleMapsWebKey) {
        logger.warn('GOOGLE_MAPS_WEB_KEY is missing; falling back to GOOGLE_MAPS_API_KEY for Places/Geocoding/Directions. If that key carries an Android application restriction, those calls will fail with REQUEST_DENIED.')
    }
}

android {
    namespace = "com.hudhud.admin"
    compileSdk = 36
    ndkVersion = "27.0.12077973"

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.hudhud.admin"
        minSdkVersion = flutter.minSdkVersion
        targetSdk = 36
        versionCode = flutter.versionCode
        versionName = flutter.versionName

        manifestPlaceholders["googleMapsApiKey"] = googleMapsApiKey

        buildConfigField(
            "String",
            "GOOGLE_MAPS_API_KEY",
            "\"${googleMapsApiKey}\""
        )

        buildConfigField(
            "String",
            "GOOGLE_MAPS_WEB_KEY",
            "\"${googleMapsWebKey}\""
        )
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias = keystoreProperties["keyAlias"]
                keyPassword = keystoreProperties["keyPassword"]
                storePassword = keystoreProperties["storePassword"]

                def storeFilePath = keystoreProperties["storeFile"]

                if (storeFilePath) {
                    storeFile = resolveKeystoreFile(storeFilePath)
                }
            }
        }
    }

    buildTypes {
        release {
            // Never fall back to the debug keystore for release artifacts.
            // When key.properties is missing the release signingConfig is left
            // unset and the taskGraph check below fails the build.
            if (keystorePropertiesFile.exists()) {
                signingConfig = signingConfigs.release
            }
        }
    }
}

// Fail release builds (assembleRelease / bundleRelease / flutter build apk|appbundle)
// early with a clear message when signing is not configured. Debug and profile
// builds are unaffected.
gradle.taskGraph.whenReady { graph ->
    def releaseRequested = graph.allTasks.any { task ->
        task.project == project && task.name.toLowerCase().contains("release")
    }
    if (!releaseRequested) {
        return
    }
    if (!keystorePropertiesFile.exists()) {
        throw new GradleException(
            "Release signing is not configured: ${keystorePropertiesFile} is missing. " +
            "Create android/key.properties with storeFile, storePassword, keyAlias and keyPassword " +
            "(see README). Release builds are never signed with the debug key."
        )
    }
    def missing = ["storeFile", "storePassword", "keyAlias", "keyPassword"].findAll {
        !keystoreProperties[it]
    }
    if (!missing.isEmpty()) {
        throw new GradleException(
            "Release signing is misconfigured: ${keystorePropertiesFile} is missing ${missing.join(', ')}."
        )
    }
    def storeFileCheck = resolveKeystoreFile(keystoreProperties['storeFile'])
    if (!storeFileCheck.exists()) {
        throw new GradleException(
            "Release signing is misconfigured: keystore not found at ${storeFileCheck}."
        )
    }
}

flutter {
    source = "../.."
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}

def notificationSoundSource =
    file("${rootProject.projectDir.parentFile}/assets/sound/notification_sound.mp3")
def notificationSoundTarget =
    file("${projectDir}/src/main/res/raw/notification_sound.mp3")

tasks.register("syncNotificationSound", Copy) {
    from notificationSoundSource
    into notificationSoundTarget.parentFile
    onlyIf { notificationSoundSource.exists() }
}

preBuild.dependsOn syncNotificationSound
