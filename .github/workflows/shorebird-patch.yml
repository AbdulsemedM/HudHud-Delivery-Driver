# Creates a Shorebird patch against an existing release version.
#
# A PATCH ONLY WORKS ON A BUILD THAT SHOREBIRD MADE. Patching replaces the
# Dart code inside an existing release, so the build on the rider's phone must
# have come from `shorebird release` (which embeds the updater). A build from
# plain `flutter build` cannot be patched at any version - it has no updater to
# receive one. Release first, distribute that build, then patch it.
#
# Triggers:
#   - workflow_dispatch with release_version (+ platform, track)
#   - push tag hotfix-<version> e.g. hotfix-1.0.5+32
#
# CLI equivalent:
#   shorebird patch android --release-version=1.0.5+32 --track=stable

name: Shorebird Patch

on:
  push:
    tags:
      - 'hotfix-*'
  workflow_dispatch:
    inputs:
      release_version:
        description: Existing Shorebird release version (e.g. 1.0.5+32)
        required: true
        type: string
      platform:
        description: Platform to patch
        required: true
        default: both
        type: choice
        options:
          - android
          - ios
          - both
      track:
        description: Shorebird track (stable, staging, beta, …)
        required: true
        default: stable
        type: string

env:
  SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}

jobs:
  # Everything that can be wrong BEFORE a build starts, named at once.
  #
  # The customer app learned this the slow way: a missing secret was found one
  # job at a time - Android stopped at the keystore, iOS stopped at "You must
  # be logged in", and neither mentioned the other three. Somebody fixed one,
  # re-ran, and met the next.
  preflight:
    name: Check this app can be patched at all
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # THE ONE THIS APP WILL FAIL ON FIRST.
      #
      # This repository has never been initialised with Shorebird: there is no
      # shorebird.yaml, so there is no app_id, so Shorebird has no idea which
      # app a patch belongs to. The file is created by `shorebird init`, run
      # once by someone signed in to the Shorebird account - the app_id inside
      # it is issued by Shorebird and cannot be invented or copied from the
      # customer app, which is a different app.
      - name: shorebird.yaml exists and names an app
        run: |
          set -uo pipefail
          if [ ! -f shorebird.yaml ]; then
            echo "::error::shorebird.yaml is missing — this app has never been initialised with Shorebird."
            echo
            echo "Run ONCE, locally, signed in to the Shorebird account:"
            echo "    shorebird init"
            echo
            echo "It creates shorebird.yaml with an app_id issued by Shorebird, and adds"
            echo "the file to pubspec.yaml's assets. Commit both. Do NOT copy the app_id"
            echo "from the customer app — that is a different app and patches would go to"
            echo "the wrong one."
            exit 1
          fi
          if ! grep -Eq '^app_id:[[:space:]]*[0-9a-fA-F-]{8,}' shorebird.yaml; then
            echo "::error::shorebird.yaml has no usable app_id."
            cat shorebird.yaml
            exit 1
          fi
          echo "ok       shorebird.yaml ($(grep -E '^app_id:' shorebird.yaml))"

      - name: shorebird.yaml is bundled as an asset
        run: |
          set -uo pipefail
          if ! grep -q 'shorebird.yaml' pubspec.yaml; then
            echo "::error::pubspec.yaml does not list shorebird.yaml under assets."
            echo "The updater reads it at runtime; without it the patch is downloaded and ignored."
            echo "Add it under flutter: assets: — `shorebird init` normally does this."
            exit 1
          fi
          echo "ok       shorebird.yaml is bundled"

      - name: Which secrets are set
        env:
          SB: ${{ secrets.SHOREBIRD_TOKEN }}
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KPW: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SPW: ${{ secrets.ANDROID_STORE_PASSWORD }}
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
          MAPS: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          set -uo pipefail
          missing=0
          check () {
            if [ -z "${2:-}" ]; then
              echo "::error::MISSING  $1 — $3"
              missing=1
            else
              echo "ok       $1"
            fi
          }
          check SHOREBIRD_TOKEN          "${SB:-}"    "console.shorebird.dev -> service account key. Without it nothing can be released or patched, on either platform."
          check ANDROID_KEYSTORE_BASE64  "${KS:-}"    "the Play upload keystore: base64 -w0 upload-keystore.jks"
          check ANDROID_KEY_ALIAS        "${ALIAS:-}" "the alias inside that keystore"
          check ANDROID_KEY_PASSWORD     "${KPW:-}"   "the key password"
          check ANDROID_STORE_PASSWORD   "${SPW:-}"   "the keystore password"

          # android/app/build.gradle applies com.google.gms.google-services,
          # and android/app/google-services.json is gitignored, so unless it is
          # supplied here the Android build fails on the Firebase task.
          if [ -f android/app/google-services.json ]; then
            echo "ok       google-services.json is in the repository"
          else
            check GOOGLE_SERVICES_JSON "${GSJ:-}" "base64 -w0 android/app/google-services.json — download it from Firebase console → Project settings → Your apps"
          fi

          # THE ONE THAT WOULD NOT HAVE FAILED THE BUILD.
          #
          # build.gradle reads this from .env or android/local.properties and
          # defaults it to an empty string, so without it the build succeeds
          # and ships an app whose map is blank - build.gradle's own warning
          # says exactly that. A delivery app with no map is worth failing a
          # build over.
          check GOOGLE_MAPS_API_KEY "${MAPS:-}" "the Android Maps SDK key; without it the build passes and the map ships blank"
          if [ "$missing" = "1" ]; then
            echo
            echo "Add them at Settings -> Secrets and variables -> Actions."
            echo "Only the ANDROID_*, GOOGLE_SERVICES_JSON and GOOGLE_MAPS_API_KEY"
            echo "ones are needed for an Android build;"
            echo "iOS needs SHOREBIRD_TOKEN alone."
            exit 1
          fi
          echo "Every secret this build needs is present."

  resolve:
    needs: preflight
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.version.outputs.release_version }}
      platform: ${{ steps.version.outputs.platform }}
      track: ${{ steps.version.outputs.track }}
    steps:
      - name: Resolve version / platform / track
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.release_version }}"
            PLATFORM="${{ inputs.platform }}"
            TRACK="${{ inputs.track }}"
          else
            # Tag format: hotfix-1.0.5+32
            REF="${GITHUB_REF_NAME}"
            VERSION="${REF#hotfix-}"
            PLATFORM="both"
            TRACK="stable"
          fi
          if [[ -z "${VERSION}" ]]; then
            echo "::error::release_version is required"
            exit 1
          fi
          echo "release_version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "platform=${PLATFORM}" >> "$GITHUB_OUTPUT"
          echo "track=${TRACK}" >> "$GITHUB_OUTPUT"
          echo "Resolved release_version=${VERSION} platform=${PLATFORM} track=${TRACK}"

  patch-android:
    needs: [preflight, resolve]
    if: needs.resolve.outputs.platform == 'android' || needs.resolve.outputs.platform == 'both'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # android/app/build.gradle reads rootProject.file("key.properties") and
      # leaves the release signingConfig unset when it is absent, so an
      # unsigned build would be produced rather than a failure.
      - name: Create android/key.properties from secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          for v in ANDROID_KEYSTORE_BASE64 ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD ANDROID_STORE_PASSWORD; do
            if [[ -z "${!v:-}" ]]; then
              echo "::error::Missing repository secret ${v}; release builds require the upload keystore."
              exit 1
            fi
          done
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/upload-keystore.jks"
          {
            echo "storeFile=${RUNNER_TEMP}/upload-keystore.jks"
            echo "storePassword=${ANDROID_STORE_PASSWORD}"
            echo "keyAlias=${ANDROID_KEY_ALIAS}"
            echo "keyPassword=${ANDROID_KEY_PASSWORD}"
          } > android/key.properties

      # Two more build inputs that live outside the repository.
      #
      # google-services.json is gitignored and the Firebase Gradle plugin fails
      # without it. The Maps key is the quieter one: build.gradle defaults it to
      # an empty string, so leaving it out produces a build that works and a map
      # that doesn't.
      - name: Create Firebase and Maps config from secrets
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          set -euo pipefail

          if [ -f android/app/google-services.json ]; then
            echo "google-services.json already in the checkout; leaving it alone."
          else
            echo "${GOOGLE_SERVICES_JSON}" | base64 --decode > android/app/google-services.json
            # A truncated or non-base64 secret decodes to junk, and the Gradle
            # failure that follows is about JSON parsing rather than the secret.
            python3 -c "import json,sys; json.load(open('android/app/google-services.json'))" || {
              echo "::error::GOOGLE_SERVICES_JSON did not decode to valid JSON. Re-copy it with: base64 -w0 google-services.json"
              exit 1
            }
            echo "google-services.json written from the secret."
          fi

          # build.gradle reads this key out of android/local.properties, which is
          # gitignored, so it is appended rather than written over whatever the
          # runner already put there.
          touch android/local.properties
          echo "GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}" >> android/local.properties
          echo "Maps key appended to android/local.properties."

      # A patch applies to a release that already exists. Checked explicitly so
      # the failure says "that version was never released" rather than coming
      # out of the patch command as something vaguer.
      - name: Verify release exists
        run: |
          set -euo pipefail
          VERSION="${{ needs.resolve.outputs.release_version }}"
          echo "Patching Android release version: ${VERSION}"
          shorebird releases list | tee /tmp/releases.txt
          if ! grep -F "${VERSION}" /tmp/releases.txt; then
            echo "::error::No Shorebird release ${VERSION}. Run the Shorebird Release workflow for this version first, and make sure the build on the device came from it."
            exit 1
          fi

      - name: Shorebird patch Android
        uses: shorebirdtech/shorebird-patch@v1
        with:
          platform: android
          args: >-
            --release-version=${{ needs.resolve.outputs.release_version }}
            --track=${{ needs.resolve.outputs.track }}
            --no-confirm

  patch-ios:
    needs: [preflight, resolve]
    if: needs.resolve.outputs.platform == 'ios' || needs.resolve.outputs.platform == 'both'
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: Verify release exists
        run: |
          set -euo pipefail
          VERSION="${{ needs.resolve.outputs.release_version }}"
          echo "Patching iOS release version: ${VERSION}"
          shorebird releases list | tee /tmp/releases.txt
          if ! grep -F "${VERSION}" /tmp/releases.txt; then
            echo "::error::No Shorebird release ${VERSION}. Run the Shorebird Release workflow for this version first."
            exit 1
          fi

      - name: Shorebird patch iOS
        uses: shorebirdtech/shorebird-patch@v1
        with:
          platform: ios
          args: >-
            --release-version=${{ needs.resolve.outputs.release_version }}
            --track=${{ needs.resolve.outputs.track }}
            --no-confirm
