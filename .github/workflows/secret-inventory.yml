# One-off: list the NAMES of the secrets and variables this repository can see.
#
# GitHub secrets are per-repository. A secret set on another repository - or set
# at the organisation level without this repository in its allow list - is
# simply absent here, and a workflow reading it gets an empty string rather
# than an error. That is how a key can be "in GitHub" and still missing from a
# build.
#
# Prints NAMES ONLY. The values are never echoed; the names come out of
# toJSON(), whose values GitHub masks anyway.
#
# Delete this alongside shorebird-init.yml.

name: Secret inventory (one-off)

on:
  workflow_dispatch:

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - name: What this repository can see
        env:
          SECRET_JSON: ${{ toJSON(secrets) }}
          VARS_JSON: ${{ toJSON(vars) }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os

          for label, key in (("SECRETS", "SECRET_JSON"), ("VARIABLES", "VARS_JSON")):
              try:
                  names = sorted(json.loads(os.environ.get(key) or "{}"))
              except json.JSONDecodeError:
                  names = ["<could not parse>"]
              # github_token is injected into every workflow; it is not something
              # anybody configured, so it is not worth listing as if it were.
              names = [n for n in names if n != "github_token"]
              print(f"--- {label} ({len(names)}) ---")
              for n in names:
                  print(f"  {n}")
              print()
          PY

      # Who can raise the API key's role, since only an Admin or the Owner can.
      - name: Setup Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: Who is in this Shorebird organisation
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
          set -uo pipefail
          echo "--- shorebird members --help ---"
          shorebird members --help || true
          echo
          echo "--- members of org 63007 ---"
          shorebird members list --org-id 63007 || shorebird members list || true
